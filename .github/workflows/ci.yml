name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXTAUTH_SECRET: ci-placeholder-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  nixpacks-build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXTAUTH_SECRET: ci-placeholder-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker info
        run: docker info

      - name: Install Nixpacks CLI
        run: |
          curl -fsSL https://nixpacks.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Nixpacks version
        run: nixpacks --version

      - name: Nixpacks plan
        run: nixpacks plan .

      - name: Nixpacks build
        run: nixpacks build . --name jongo-os-nixpacks-ci-${{ github.run_id }}

      - name: Cleanup Nixpacks image
        if: always()
        run: docker rmi jongo-os-nixpacks-ci-${{ github.run_id }} || true
