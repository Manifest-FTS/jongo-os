services:
  db:
    image: postgres:16-alpine
    container_name: jongo-os-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jongo}
      POSTGRES_USER: ${POSTGRES_USER:-jongo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jongo-change-me}
    ports:
      - "5432:5432"
    volumes:
      - jongo_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jongo} -d ${POSTGRES_DB:-jongo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jongo-os-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://jongo:jongo-change-me@db:5432/jongo}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  jongo_os_pgdata: