[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci", "npm run prisma:generate"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "(npm run db:migrate:deploy || echo '[startup] prisma migrate deploy failed; continuing startup') && HOSTNAME=0.0.0.0 npm run start --workspace @jongo-os/web"
